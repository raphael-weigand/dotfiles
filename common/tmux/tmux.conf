unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

set -g prefix C-s

# Full mouse support: select panes/windows, resize panes and scroll/copy.
set -g mouse on

# Vim-style pane navigation after the prefix.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Ghostty provides true color; tmux advertises its own terminal to programs inside.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",ghostty:RGB"
set -g cursor-style block

# Minimal Gruber Darker status line. Keep the terminal background visible;
# color distinguishes the active window without drawing a background block.
set -g status-position top
set -g status-justify centre
set -g status-left ""
set -g status-right ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=#e4e4ef,bg=default"
set -g window-status-style "fg=#95a99f,bg=default"
set -g window-status-current-style "fg=#ffdd33,bg=default,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g pane-border-style "fg=#453d41"
set -g pane-active-border-style "fg=#96a6c8"

# Clipboard support, including OSC 52 passthrough over SSH.
set -g set-clipboard on
set -g allow-passthrough on

# TPM is kept for future tmux plugins, but the Neovim/tmux navigator is not
# needed: pane navigation is intentionally explicit and prefix-based.
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
