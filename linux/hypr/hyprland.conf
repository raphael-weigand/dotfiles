# Hyprland - T2 MacBook Pro desktop

# Any external display: use its preferred mode and let Hyprland place it automatically.
# Do not hardcode DP-* names: they can change between boots/reconnects on this hardware.
monitor = , preferred, auto, 1

# Internal MacBook display. Match by EDID description because the eDP-* connector name
# can change between boots on this hardware.
monitor = desc:Apple Computer Inc Color LCD, 3072x1920@60, auto, 2

input {
    kb_layout = de
    kb_variant = mac
    kb_options = caps:escape
    follow_mouse = 0

    touchpad {
        natural_scroll = true
    }
}

# Logitech MX Keys Mini in its Mac/Windows hybrid mode.
# The keyboard reports the physical Option/Start key as LWIN and the physical Cmd/Alt
# key as LALT. Keep those physical positions and assign their macOS roles directly:
#   Option/Start -> XKB level 3 (Option): Opt+8={, Opt+9=}, Opt+L=@, ...
#   Cmd/Alt      -> Super: Hyprland SUPER shortcuts
#
# de(mac) already contains the correct German macOS third-level symbols. We therefore
# must NOT swap Alt/Win: doing so makes Cmd the level-3 key instead of Super.
device {
    name = logitech-mx-keys-mini
    kb_layout = de
    kb_variant = mac
    kb_options = caps:escape,lv3:lwin_switch,altwin:alt_super_win
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ffdd33)
    col.inactive_border = rgb(282828)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
}

# HyMission overview
plugin {
    hymission {
        vim_keys = 1
    }
}

# Lid switch: match the internal panel by its stable EDID description instead of eDP-*.
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "desc:Apple Computer Inc Color LCD, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "desc:Apple Computer Inc Color LCD, 3072x1920@60, auto, 2"

source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
