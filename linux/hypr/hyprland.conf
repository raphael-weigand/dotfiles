# Hyprland - T2 MacBook Pro desktop

# Any external display: use its preferred mode and let Hyprland place it automatically.
# Do not hardcode DP-* names: they can change between boots/reconnects on this hardware.
monitor = , preferred, auto, 1

# Internal MacBook display. Match by EDID description because the eDP-* connector name
# can change between boots on this hardware.
monitor = desc:Apple Computer Inc Color LCD, 3072x1920@60, auto, 2

input {
    kb_file = ~/.config/hypr/xkb/mxkeys.xkb
    follow_mouse = 0

    touchpad {
        natural_scroll = true
    }
}

# MX Keys Mini: use the physical Cmd key next to Space as SUPER and both physical
# Option keys as the Macintosh third-level modifier.
device {
    name = logitech-mx-keys-mini
    kb_layout = de
    kb_variant = mac
    kb_options = caps:escape,altwin:swap_alt_win,lv3:lwin_switch,lv3:switch
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ffdd33)
    col.inactive_border = rgb(282828)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
}

# Lid switch events handle normal open/close changes. The sync call also runs on
# startup/config reload and reads the current EV_SW/SW_LID state from the Linux
# input device, whose event number is discovered dynamically by the helper.
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/lid-display.sh closed
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/lid-display.sh open
exec = ~/.config/hypr/lid-display.sh sync

# HyMission overview
