# Hyprland - T2 MacBook Pro desktop

# Monitor configuration is handled dynamically by lid-display.sh. Connector names
# are unstable on this T2 MacBook, so do not hardcode eDP-* or DP-* outputs here.

input {
    kb_layout = de
    kb_options = caps:escape
    follow_mouse = 0

    touchpad {
        natural_scroll = true
    }
}

# MX Keys Mini: use the physical Cmd key next to Space as SUPER and both physical
# Option keys as the Macintosh third-level modifier.
device {
    name = logitech-mx-keys-mini
    kb_file = ~/.config/hypr/xkb/mxkeys.xkb
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ffdd33)
    col.inactive_border = rgb(282828)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
}

# LocalSend behaves like an overlay instead of taking a dwindle tile.
windowrule {
    name = localsend-overlay
    match:class = ^org\.localsend\.localsend_app$
    float = on
    center = on
    size = 900 650
}

animations {
    enabled = true

    # Fenster weiterhin animieren, aber deutlich direkter
    animation = windows, 1, 2, default
    animation = windowsOut, 1, 2, default
    animation = fade, 1, 2, default

    # Workspace-Wechsel komplett ohne Animation
    animation = workspaces, 0
}

decoration {
    active_opacity = 0.92
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

# Lid switch events handle normal open/close changes. The sync call also runs on
# startup/config reload and reads the current EV_SW/SW_LID state from the Linux
# input device, whose event number is discovered dynamically by the helper.
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/lid-display.sh closed
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/lid-display.sh open
exec = ~/.config/hypr/lid-display.sh sync

# HyMission overview
# plugin {
