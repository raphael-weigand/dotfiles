# Hyprland - T2 MacBook Pro desktop

# Keep both possible internal eDP connector names disabled in the static config.
# On this T2 MacBook the real panel can appear as eDP-1 or eDP-2, while the other
# connector may be a phantom output. lid-display.sh enables the real panel by its
# EDID description when the lid is open. This prevents config reloads from briefly
# enabling the internal outputs and stealing the active workspace.
monitor = eDP-1, disable
monitor = eDP-2, disable

# Any remaining (external) display: use its preferred mode and let Hyprland place
# it automatically. Do not hardcode DP-* names: they can change between boots.
monitor = , preferred, auto, 1

input {
    kb_layout = de
    kb_options = caps:escape
    follow_mouse = 0

    touchpad {
        natural_scroll = true
    }
}

# MX Keys Mini: use the physical Cmd key next to Space as SUPER and both physical
# Option keys as the Macintosh third-level modifier.
device {
    name = logitech-mx-keys-mini
    kb_file = ~/.config/hypr/xkb/mxkeys.xkb
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ffdd33)
    col.inactive_border = rgb(282828)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
}

# Lid switch events handle normal open/close changes. The sync call also runs on
# startup/config reload and reads the current EV_SW/SW_LID state from the Linux
# input device, whose event number is discovered dynamically by the helper.
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/lid-display.sh closed
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/lid-display.sh open
exec = ~/.config/hypr/lid-display.sh sync

# HyMission overview
# plugin {
