# Hyprland - T2 MacBook Pro desktop

# External BenQ on AMD
monitor = DP-3, 2560x1080@59.98, 0x0, 1

# Internal MacBook display on Intel
monitor = eDP-2, 3072x1920@60, 2560x0, 2

# AMD hybrid/duplicate eDP path
monitor = eDP-1, disable

input {
    kb_layout = de
    kb_options = caps:escape

    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ffdd33)
    col.inactive_border = rgb(282828)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
}

# Lid switch: disable only the Intel internal panel.
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-2, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-2, 3072x1920@60, 2560x0, 2"

source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
