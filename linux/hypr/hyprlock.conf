general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(181818)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(e4e4ef)
    font_size = 72
    font_family = Iosevka Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B"
    color = rgb(95a99f)
    font_size = 18
    font_family = Iosevka Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(ffdd33)
    inner_color = rgb(282828)
    font_color = rgb(e4e4ef)
    fade_on_empty = false
    placeholder_text = <span foreground="##95a99f">Passwort</span>
    position = 0, -80
    halign = center
    valign = center
}
