# Applications
bind = SUPER, T, exec, ghostty
bind = SUPER, SPACE, exec, fuzzel
bind = SUPER, E, exec, thunar
bind = SUPER, C, exec, chromium
bind = SUPER, A, exec, localsend
# Aerion Mail
bind = SUPER, M, exec, env WEBKIT_DISABLE_COMPOSITING_MODE=1 aerion

# Windows
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, V, togglefloating
# bind = SUPER, TAB, hymission:toggle

# Vim-style focus navigation: mirrors Ctrl+H/J/K/L in Neovim
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Vim-style tile resizing
bind = SUPER CTRL, H, resizeactive, -50 0
bind = SUPER CTRL, J, resizeactive, 0 50
bind = SUPER CTRL, K, resizeactive, 0 -50
bind = SUPER CTRL, L, resizeactive, 50 0

# Dwindle split-ratio presets for the active tile.
# Left-to-right on the home row means smaller-to-larger.
bind = SUPER CTRL, A, layoutmsg, splitratio 0.5 exact
bind = SUPER CTRL, S, layoutmsg, splitratio 0.666 exact
bind = SUPER CTRL, D, layoutmsg, splitratio 1.0 exact
bind = SUPER CTRL, F, layoutmsg, splitratio 1.333 exact

# Split mode: mirrors <leader>s... in Neovim.
# SUPER+S, then H/V/C/X. Each action returns to the normal keymap.
bind = SUPER, S, submap, split

submap = split
bind = , H, exec, hyprctl dispatch layoutmsg "preselect d" && hyprctl dispatch exec ghostty && hyprctl dispatch submap reset
bind = , V, exec, hyprctl dispatch layoutmsg "preselect r" && hyprctl dispatch exec ghostty && hyprctl dispatch submap reset
bind = , C, exec, hyprctl dispatch killactive && hyprctl dispatch submap reset
bind = , X, exec, hyprctl dispatch layoutmsg swapsplit && hyprctl dispatch submap reset
bind = , ESCAPE, submap, reset
submap = reset

# Window groups: multiple windows share one tile like tabs.
# SUPER+G opens group mode. N launches another instance of the focused program
# into the group without hardcoding an application name.
bind = SUPER, G, submap, group

submap = group
bind = , G, exec, hyprctl dispatch togglegroup && hyprctl dispatch submap reset
bind = , N, exec, ~/.config/hypr/new-group-window.sh; hyprctl dispatch submap reset
bind = , H, exec, hyprctl dispatch changegroupactive b && hyprctl dispatch submap reset
bind = , L, exec, hyprctl dispatch changegroupactive f && hyprctl dispatch submap reset
bind = , M, exec, hyprctl dispatch moveoutofgroup && hyprctl dispatch submap reset
bind = , ESCAPE, submap, reset
submap = reset

# Desk control: SUPER+D opens desk mode. Each action returns to the normal keymap.
# U/D = preferred standing/sitting heights, K/J = mechanical maximum/minimum.
bind = SUPER, D, submap, desk

submap = desk
bind = , U, exec, /home/raphael/.local/bin/desk move-to 58.51 && hyprctl dispatch submap reset
bind = , D, exec, /home/raphael/.local/bin/desk move-to 9.94 && hyprctl dispatch submap reset
bind = , K, exec, /home/raphael/.local/bin/desk move-to 65 && hyprctl dispatch submap reset
bind = , J, exec, /home/raphael/.local/bin/desk move-to 0 && hyprctl dispatch submap reset
bind = , ESCAPE, submap, reset
submap = reset

# Move windows directly while keeping Vim-style directions
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Mouse window control
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Session
bind = SUPER SHIFT, Q, exec, ~/.config/hypr/power-menu.sh
bind = SUPER SHIFT, X, exec, hyprlock

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Relative workspace navigation through existing workspaces.
# N = next, B = back. P stays reserved for the scratchpad below.
bind = SUPER, N, workspace, r+1
bind = SUPER, B, workspace, r-1
bind = SUPER SHIFT, N, movetoworkspace, r+1
bind = SUPER SHIFT, B, movetoworkspace, r-1

bind = SUPER SHIFT, A, exec, ~/.config/hypr/gather-workspaces.sh
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Scratchpad (SUPER+S is reserved for Neovim-style split mode)
bind = SUPER, P, togglespecialworkspace, scratchpad
bind = SUPER SHIFT, P, movetoworkspace, special:scratchpad

# Audio
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Clipboard
bind = SUPER, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Screenshots: save to Pictures, copy the PNG to the clipboard and notify when done
bind = SUPER CTRL, 3, exec, mkdir -p ~/Pictures && grim - | tee ~/Pictures/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy --type image/png && notify-send "Screenshot" "Bild aufgenommen und kopiert"
bind = SUPER CTRL, 4, exec, mkdir -p ~/Pictures && grim -g "$(slurp)" - | tee ~/Pictures/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy --type image/png && notify-send "Screenshot" "Bild aufgenommen und kopiert"
bind = SUPER CTRL, 5, exec, geometry="$(slurp)" && sleep 5 && mkdir -p ~/Pictures && grim -g "$geometry" - | tee ~/Pictures/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy --type image/png && notify-send "Screenshot" "Bild aufgenommen und kopiert"
