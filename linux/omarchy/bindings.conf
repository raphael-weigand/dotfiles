# Personal Omarchy 4.0.4 overrides; loaded from Omarchy's bindings.conf.
# Omarchy keeps its launcher, clipboard, screenshot, media and session bindings.
# Remove default shortcuts that conflict with personal overrides.
unbind = SUPER, T
unbind = SUPER, E
unbind = SUPER, C
unbind = SUPER, A
unbind = SUPER, R
unbind = SUPER, Q
unbind = SUPER, F
unbind = SUPER SHIFT, V
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, J
unbind = SUPER SHIFT, K
unbind = SUPER SHIFT, L
unbind = SUPER SHIFT, A
unbind = SUPER SHIFT, S
unbind = SUPER SHIFT, D
unbind = SUPER SHIFT, F
unbind = SUPER, G
unbind = SUPER CTRL, H
unbind = SUPER CTRL, J
unbind = SUPER CTRL, K
unbind = SUPER CTRL, L
unbind = SUPER, N
unbind = SUPER, B
unbind = SUPER SHIFT, N
unbind = SUPER SHIFT, B
unbind = SUPER, P
unbind = SUPER SHIFT, P

# Applications
bind = SUPER, T, exec, ghostty
bind = SUPER, E, exec, thunar
bind = SUPER, C, exec, chromium
bind = SUPER, A, exec, localsend
bind = SUPER, R, exec, ~/dotfiles/linux/hypr/focus-or-launch.sh org.remmina.Remmina remmina
# Aerion Mail
bind = SUPER SHIFT, M, exec, ~/dotfiles/linux/hypr/focus-or-launch.sh io.github.hkdb.Aerion env WEBKIT_DISABLE_COMPOSITING_MODE=1 aerion
bind = SUPER SHIFT, E, exec, ~/dotfiles/linux/hypr/focus-or-launch.sh Enpass /usr/bin/enpass
bind = SUPER SHIFT, I, exec, ~/dotfiles/linux/hypr/focus-or-launch.sh signal /usr/bin/signal-desktop
# WhatsApp
bind = SUPER SHIFT, W, exec, ~/dotfiles/linux/hypr/focus-or-launch.sh chrome-web.whatsapp.com__-Default chromium --app=https://web.whatsapp.com/
bind = SUPER SHIFT, Y, exec, ~/dotfiles/linux/hypr/focus-or-launch.sh chrome-youtube.com__-Default chromium --app=https://youtube.com

# Windows
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, V, exec, hyprctl dispatch togglefloating && hyprctl dispatch fullscreen 1
# bind = SUPER, TAB, hymission:toggle

# Vim-style focus navigation: mirrors Ctrl+H/J/K/L in Neovim
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Vim-style tile resizing
bind = SUPER SHIFT, H, resizeactive, -50 0
bind = SUPER SHIFT, J, resizeactive, 0 50
bind = SUPER SHIFT, K, resizeactive, 0 -50
bind = SUPER SHIFT, L, resizeactive, 50 0

# Dwindle split-ratio presets for the active tile.
# Left-to-right on the home row means smaller-to-larger.
bind = SUPER SHIFT, S, layoutmsg, splitratio 0.666 exact
bind = SUPER SHIFT, D, layoutmsg, splitratio 1.0 exact
bind = SUPER SHIFT, F, layoutmsg, splitratio 1.333 exact

# # Split mode: mirrors <leader>s... in Neovim.
# # SUPER+S, then H/V/C/X. Each action returns to the normal keymap.
# bind = SUPER, S, submap, split
#
# submap = split
# bind = , H, exec, hyprctl dispatch layoutmsg "preselect d" && hyprctl dispatch exec ghostty && hyprctl dispatch submap reset
# bind = , V, exec, hyprctl dispatch layoutmsg "preselect r" && hyprctl dispatch exec ghostty && hyprctl dispatch submap reset
# bind = , C, exec, hyprctl dispatch killactive && hyprctl dispatch submap reset
# bind = , X, exec, hyprctl dispatch layoutmsg swapsplit && hyprctl dispatch submap reset
# bind = , ESCAPE, submap, reset
# submap = reset

# Window groups: multiple windows share one tile like tabs.
# SUPER+G opens group mode. N launches another instance of the focused program
# into the group without hardcoding an application name.
bind = SUPER, G, submap, group

submap = group
bind = , G, exec, hyprctl dispatch togglegroup && hyprctl dispatch submap reset
bind = , H, exec, hyprctl dispatch changegroupactive b && hyprctl dispatch submap reset
bind = , L, exec, hyprctl dispatch changegroupactive f && hyprctl dispatch submap reset
bind = , M, exec, hyprctl dispatch moveoutofgroup && hyprctl dispatch submap reset
bind = , ESCAPE, submap, reset
submap = reset

# Move windows directly while keeping Vim-style directions
bind = SUPER CTRL, H, movewindow, l
bind = SUPER CTRL, J, movewindow, d
bind = SUPER CTRL, K, movewindow, u
bind = SUPER CTRL, L, movewindow, r

# Mouse window control
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Session
# Omarchy owns session menu
bind = SUPER SHIFT, X, exec, hyprlock

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Relative workspace navigation through existing workspaces.
# N = next, B = back. P stays reserved for the scratchpad below.
bind = SUPER, N, workspace, r+1
bind = SUPER, B, workspace, r-1
bind = SUPER SHIFT, N, movetoworkspace, r+1
bind = SUPER SHIFT, B, movetoworkspace, r-1

bind = SUPER SHIFT, A, exec, ~/dotfiles/linux/hypr/gather-workspaces.sh
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Scratchpad (SUPER+S is reserved for Neovim-style split mode)
bind = SUPER, P, togglespecialworkspace, scratchpad
bind = SUPER SHIFT, P, movetoworkspace, special:scratchpad

